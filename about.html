<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- The Info page moved from /about to /info. GitHub Pages can't issue a real
       301, so this stub stands in: canonical hands the ranking signals to /info,
       the meta refresh covers crawlers and no-JS visitors, and the script makes
       it instant (and keeps /about out of the back-button history). Safe to
       delete once nothing links to /about any more. -->
  <title>Redirecting to Info — Dominic DeCarlo</title>
  <link rel="canonical" href="https://decarlo.design/info" />
  <meta http-equiv="refresh" content="0; url=/info" />
  <script>location.replace("/info");</script>
</head>
<body>
  <p>The Info page has moved to <a href="/info">decarlo.design/info</a>.</p>
</body>
</html>
