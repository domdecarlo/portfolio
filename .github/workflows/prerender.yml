# Keeps work/ in sync with data.js.
#
# Every project page under work/ is generated by build-seo.mjs. Adding a project
# to data.js and committing it from GitHub Desktop would otherwise ship a tile on
# the front page pointing at a URL with no file behind it — a 404. This rebuilds
# on push and commits the result back, so the generated pages can't drift from
# the data they come from.
#
# The site is served by Pages from the main branch, so the commit this makes is
# itself what triggers the deploy. Pushes authenticated with GITHUB_TOKEN don't
# start new workflow runs, which is what keeps this from looping on itself.
#
# Note: after this runs, your local main is one commit behind — Desktop will
# offer "Pull origin". That's the tradeoff for having the pages live in the repo,
# which is also what lets you preview them locally.

name: Prerender project pages

on:
  push:
    branches: [main]
    paths:
      - data.js # the content these pages are built from
      - build-seo.mjs # the generator itself
      - work/** # rebuild over hand-edits; build-seo.mjs owns this directory
      - assets/** # share images are picked by checking what exists on disk
  workflow_dispatch: # plus a manual "Run workflow" button

# One run at a time. Two pushes in quick succession would otherwise race, and
# the second run's push would be rejected as non-fast-forward.
concurrency:
  group: prerender
  cancel-in-progress: false

permissions:
  contents: write # to commit the regenerated pages back

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install step: build-seo.mjs has no dependencies. (The jsdom in
      # package.json is only ever used for local testing.)
      - name: Build project pages
        run: |
          node build-seo.mjs 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Surface the run in the job summary. build-seo.mjs warns but still exits 0
      # when a cover image is missing, falling back to the default share image —
      # so a typo'd path in data.js is easy to miss without this.
      - name: Report
        if: always()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          {
            if grep -q '^  !' "$log"; then
              echo '> [!WARNING]'
              echo '> build-seo.mjs reported warnings. The pages still built, using'
              echo '> fallbacks — check the paths in `data.js`.'
              echo ''
            fi
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit regenerated pages
        run: |
          # -A stages new, changed and pruned pages alike, so a renamed project
          # id is handled the same as a new one. Comparing the index against HEAD
          # is what catches brand-new files, which `git diff` alone would not.
          git add -A -- work
          if git diff --cached --quiet -- work; then
            echo "work/ already matches data.js — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate project pages from data.js"
          git push origin HEAD:${{ github.ref_name }}

          echo "Committed:" >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
