<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Project — Dominic DeCarlo</title>
  <meta name="description" content="Selected project work by Dominic DeCarlo, brand and visual designer." />

  <!-- Legacy entry point. Every project now has a canonical, prerendered page
       at /work/<id>/ (generated by build-seo.mjs) with its own title, share
       image and description. This file still renders any project via
       ?id=<id> so old links keep working, but it is kept out of the index:
       all ten ids resolve to this one URL, which would otherwise read as
       duplicate content competing with the real pages. -->
  <meta name="robots" content="noindex, follow" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="project.html">
  <header class="topbar"></header>

  <div class="layout">
    <!-- LEFT: 1/4 width, quick info about this project -->
    <aside class="left" id="proj-info"></aside>

    <div class="divider" title="Drag to resize · double-click to reset"></div>

    <!-- RIGHT: 3/4 width, single project detail -->
    <main class="right">
      <article class="detail" id="detail"></article>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
